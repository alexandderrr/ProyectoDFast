<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="ruta" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b6bff"/>
      <stop offset="1" stop-color="#8a5cff"/>
    </linearGradient>
    <filter id="sombra" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#2f3b8f" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="800" height="480" fill="#eef1fb"/>
  <!-- manzanas -->
  <g fill="#e6eafa">
    <rect x="20" y="20" width="150" height="90" rx="10"/><rect x="200" y="30" width="120" height="70" rx="10"/>
    <rect x="350" y="20" width="160" height="100" rx="10"/><rect x="560" y="30" width="200" height="80" rx="10"/>
    <rect x="30" y="150" width="120" height="110" rx="10"/><rect x="190" y="160" width="140" height="90" rx="10"/>
    <rect x="560" y="150" width="130" height="100" rx="10"/><rect x="720" y="150" width="60" height="100" rx="10"/>
    <rect x="30" y="310" width="160" height="140" rx="10"/><rect x="230" y="330" width="120" height="120" rx="10"/>
    <rect x="410" y="340" width="150" height="110" rx="10"/><rect x="610" y="300" width="160" height="150" rx="10"/>
  </g>
  <!-- río -->
  <path d="M-20 400 C 120 330, 220 380, 330 300 S 520 190, 640 220 S 780 120, 840 90" fill="none" stroke="#d3e2ff" stroke-width="46" stroke-linecap="round"/>
  <!-- calles -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round">
    <path d="M0 130 H800" stroke-width="14"/><path d="M0 285 H800" stroke-width="16"/>
    <path d="M180 0 V480" stroke-width="14"/><path d="M340 0 V480" stroke-width="16"/>
    <path d="M540 0 V480" stroke-width="14"/><path d="M700 0 V480" stroke-width="12"/>
    <path d="M0 60 L800 210" stroke-width="8" opacity=".9"/><path d="M0 420 L800 330" stroke-width="8" opacity=".9"/>
  </g>
  <!-- ruta -->
  <path d="M150 360 L150 285 L340 285 L340 200 L540 200 L540 130 L650 130" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity=".8"/>
  <path d="M150 360 L150 285 L340 285 L340 200 L540 200 L540 130 L650 130" fill="none" stroke="url(#ruta)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- origen -->
  <circle cx="150" cy="360" r="11" fill="#fff" stroke="#3b6bff" stroke-width="5"/>
  <!-- destino -->
  <circle cx="650" cy="130" r="12" fill="#fff" stroke="#8a5cff" stroke-width="5"/>
  <!-- camión -->
  <g filter="url(#sombra)" transform="translate(340 200)">
    <circle r="24" fill="#3b6bff"/>
    <g fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-11 -7 h13 v12 h-13z"/><path d="M2 -3 h6 l4 4 v4 h-10"/>
      <circle cx="-6" cy="8" r="2.2" fill="#3b6bff"/><circle cx="8" cy="8" r="2.2" fill="#3b6bff"/>
    </g>
  </g>
</svg>
