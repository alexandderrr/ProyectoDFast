<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión - D-Fast</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .contenedor {
            width: 90%;
            max-width: 420px;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        }

        .logo {
            text-align: center;
            font-size: 55px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            color: #1f2937;
            margin-bottom: 10px;
        }

        .subtitulo {
            text-align: center;
            color: #6b7280;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #374151;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .registro {
            text-align: center;
            margin-top: 20px;
            color: #6b7280;
        }

        .registro a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        .mensaje {
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
        }

        .volver {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #6b7280;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <div class="logo">🚚</div>

        <h1>D-Fast</h1>

        <p class="subtitulo">
            Inicia sesión en tu cuenta
        </p>

        <form id="loginForm">

            <label for="correo">Correo electrónico</label>

            <input
                type="email"
                id="correo"
                placeholder="ejemplo@correo.com"
                required
            >

            <label for="password">Contraseña</label>

            <input
                type="password"
                id="password"
                placeholder="Ingresa tu contraseña"
                required
            >

            <button type="submit">
                Iniciar sesión
            </button>

        </form>

        <div id="mensaje" class="mensaje"></div>

        <p class="registro">
            ¿No tienes una cuenta?
            <a href="registro.html">Regístrate</a>
        </p>

        <a class="volver" href="index.html">
            ← Volver al inicio
        </a>

    </div>

    <script>

    document.getElementById("loginForm").addEventListener("submit", async function(event) {

        event.preventDefault();

        const correo = document.getElementById("correo").value;
        const password = document.getElementById("password").value;

        const mensaje = document.getElementById("mensaje");

        try {

            const respuesta = await fetch("/api/auth/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    correo: correo,
                    password: password
                })
            });

            const resultado = await respuesta.text();

            if (respuesta.ok) {

             mensaje.style.color = "green";
             mensaje.textContent = resultado;

                
            sessionStorage.setItem("correo", correo);

            setTimeout(function() {
            window.location.href = "home.html";
            }, 1000);

            } else {

            mensaje.style.color = "red";
            mensaje.textContent = resultado;

            }

        } catch (error) {

            mensaje.style.color = "red";
            mensaje.textContent =
                "No se pudo conectar con el servidor.";

            console.error(error);
        }

    });

</script>
</body>
</html>
